<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Secret Santa · Bvlgari Hotel Paris</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--text:#f3eee4;--muted:#9c968a;--line:#2b2820;--gold:#c9a45c;--gold-hi:#f3dca0;--surface:#0d0c0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.6;min-height:100vh;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:44px 22px 70px;text-align:center;position:relative;z-index:1}
.logo{display:block;width:min(300px,72%);margin:0 auto 26px;opacity:0;animation:fade 1.6s .2s ease forwards}
.rule{height:1px;width:0;margin:0 auto 34px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:draw 1.6s .8s ease forwards}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{width:min(260px,70%)}}
h1{font-family:Cinzel,Georgia,serif;font-weight:400;font-size:clamp(1.5rem,6vw,2.1rem);letter-spacing:.22em;margin:0 0 14px;text-transform:uppercase}
p{margin:0 0 18px;color:var(--muted);font-size:1.02rem}
textarea{width:100%;min-height:180px;padding:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:400;resize:vertical;text-align:left}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
button{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold-hi);padding:14px 28px;transition:background .3s,color .3s}
button:hover{background:var(--gold);color:#000}
button.ghost{padding:8px 16px;font-size:.7rem;border-color:var(--line);color:var(--text)}
button.ghost:hover{border-color:var(--gold);background:transparent;color:var(--gold-hi)}
.err{color:#e58a8a;min-height:1.6em;margin:10px 0 0;font-size:.95rem}
.list{margin:30px 0 0;padding:0;list-style:none;border-top:1px solid var(--line);text-align:left}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-family:Cinzel,Georgia,serif;letter-spacing:.1em}
.row{margin-top:22px}
.hint{font-size:.92rem;margin-top:24px}
/* cadeau */
.stage{padding-top:6px}
.gwrap{position:relative;width:200px;height:210px;margin:30px auto 18px}
.glow{position:absolute;left:50%;top:48%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(circle,rgba(243,220,160,.95) 0%,rgba(201,164,92,.45) 35%,transparent 70%);opacity:0;transform:scale(.2);pointer-events:none}
.glow.go{animation:burst 2.4s ease-out forwards}
@keyframes burst{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(5)}}
.gift{position:absolute;inset:0;padding:0;border:0;background:none;display:block;animation:float 3.6s ease-in-out infinite}
.gift:hover{background:none;color:inherit}
@keyframes float{50%{transform:translateY(-7px)}}
.gift .box{position:absolute;left:20px;right:20px;bottom:10px;height:120px;background:linear-gradient(#15130f,#070605);border:1px solid var(--gold);transition:opacity 1s .4s}
.gift .rib-v,.gift .lrib{position:absolute;left:50%;width:22px;margin-left:-11px;background:linear-gradient(90deg,#a8863f,var(--gold-hi),#a8863f)}
.gift .rib-v{top:0;bottom:0}
.gift .rib-h{position:absolute;left:0;right:0;top:46px;height:18px;background:linear-gradient(#a8863f,var(--gold-hi),#a8863f)}
.gift .lid{position:absolute;left:8px;right:8px;bottom:128px;height:42px;background:linear-gradient(#1b1812,#0a0907);border:1px solid var(--gold);transition:transform 1.1s cubic-bezier(.2,1.3,.4,1),opacity 1s .2s;transform-origin:left bottom}
.gift .lrib{top:0;bottom:0}
.gift .bow{position:absolute;left:50%;bottom:168px;width:70px;height:34px;margin-left:-35px;transition:transform 1s,opacity .6s}
.gift .bow i{position:absolute;top:0;width:32px;height:30px;border:3px solid var(--gold-hi);border-radius:60% 40% 60% 40%}
.gift .bow i:first-child{left:0;transform:rotate(-12deg)}
.gift .bow i:last-child{right:0;transform:scaleX(-1) rotate(-12deg)}
.gift.open{animation:none}
.gift.open .lid{transform:translate(-30px,-110px) rotate(-26deg);opacity:0}
.gift.open .bow{transform:translateY(-130px) scale(.6);opacity:0}
.gift.open .rib-h{opacity:0;transition:opacity .5s}
.gift.open .box{opacity:.18}
.cta{font-size:.78rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;font-family:Cinzel,Georgia,serif;transition:opacity .5s}
.cta.off{opacity:0}
.reveal{min-height:150px;margin-top:6px}
.lead{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-family:Cinzel,Georgia,serif;margin-bottom:16px;opacity:0;animation:fade 1s forwards}
.name{font-family:Cinzel,Georgia,serif;font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(2rem,10vw,3.4rem);line-height:1.15;word-break:break-word;color:var(--gold-hi)}
.name.done{background:linear-gradient(100deg,#b8913f 20%,#fff3c9 45%,#b8913f 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 3.2s ease-in-out 1}
@keyframes shine{from{background-position:120% 0}to{background-position:-20% 0}}
.gift.shake{animation:shake .85s ease-in both}
@keyframes shake{0%{transform:rotate(0)}15%{transform:rotate(-3deg) translateX(-3px)}30%{transform:rotate(3.5deg) translateX(3px)}45%{transform:rotate(-5deg) translateX(-4px)}60%{transform:rotate(5deg) translateX(4px)}75%{transform:rotate(-7deg) translateX(-5px) scale(1.04)}90%{transform:rotate(7deg) translateX(5px) scale(1.06)}100%{transform:rotate(0) scale(1.08)}}
.rays{position:absolute;left:50%;top:44%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(243,220,160,.4) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%)}
.rays.go{animation:rays 6s linear forwards}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.3)}10%{opacity:1;transform:rotate(15deg) scale(1)}85%{opacity:.8}100%{opacity:0;transform:rotate(110deg) scale(1.1)}}
.reveal.card{position:relative;border:1px solid var(--gold);background:linear-gradient(#14110b,#050403);padding:26px 14px 30px;margin-top:10px;box-shadow:0 0 60px rgba(201,164,92,.25);animation:rise 1.1s cubic-bezier(.2,1.2,.3,1) both}
.reveal.card:before,.reveal.card:after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold-hi)}
.reveal.card:before{top:6px;left:6px;border-right:0;border-bottom:0}
.reveal.card:after{bottom:6px;right:6px;border-left:0;border-top:0}
@keyframes rise{0%{opacity:0;transform:translateY(-200px) scale(.15) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.name{white-space:pre-wrap}
.name span{display:inline-block}
.name span.lock{animation:pop .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(1.9);color:#fff;text-shadow:0 0 24px #f3dca0}100%{transform:none}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
@media (prefers-reduced-motion:reduce){.gift{animation:none}.logo{animation-duration:.01s}.rule{animation-duration:.01s}.glow.go{animation:none}.name.done{animation:none}.gift.shake{animation:none}.rays.go{animation:none}.reveal.card{animation:none}.name span.lock{animation:none}}
</style>
</head>

function hx(n){return n.toString(16).padStart(2,"0")}
function enc(g,r){var k=1+Math.floor(Math.random()*254);var b=new TextEncoder().encode(g+"|"+r);var s=hx(k);b.forEach(function(x){s+=hx(x^k)});return s}
function dec(t){try{
 if(!/^[0-9a-f]{8,}$/.test(t)||t.length%2)return null;
 var a=t.match(/../g).map(function(x){return parseInt(x,16)});var k=a.shift();
 var s=new TextDecoder().decode(new Uint8Array(a.map(function(x){return x^k})));
 var i=s.indexOf("|");return i<1?null:[s.slice(0,i),s.slice(i+1)];
}catch(e){return null}}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function head(){
 app.innerHTML="";
 var im=el("img","logo");im.src=LOGO;im.alt="Bvlgari Hotel Paris";app.appendChild(im);
 app.appendChild(el("div","rule"));
}

function admin(){
 head();
 app.appendChild(el("h1",null,"Secret Santa"));
 app.appendChild(el("p",null,"Colle les prénoms, un par ligne. Chaque collaborateur reçoit un lien personnel qui lui révèle à qui il offre un cadeau. Les tirages restent secrets, même pour toi."));
 var ta=el("textarea");ta.placeholder="Camille\nThomas\nInès\nMarc\n…";ta.setAttribute("aria-label","Liste des prénoms");
 app.appendChild(ta);
 var err=el("p","err");app.appendChild(err);
 var go=el("button",null,"Générer les liens");app.appendChild(go);
 var out=el("div");app.appendChild(out);
 go.onclick=function(){
  var seen={},names=[];
  ta.value.split(/\n/).forEach(function(n){n=n.replace(/\|/g," ").trim();if(n&&!seen[n.toLowerCase()]){seen[n.toLowerCase()]=1;names.push(n)}});
  if(names.length<3){err.textContent="Il faut au moins 3 personnes différentes.";return}
  err.textContent="";
  for(var i=names.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=names[i];names[i]=names[j];names[j]=t}
  var base=location.href.split("#")[0];
  var rows=names.map(function(n,i){return{n:n,u:base+"#"+enc(n,names[(i+1)%names.length])}});
  rows.sort(function(a,b){return a.n.localeCompare(b.n,"fr")});
  out.innerHTML="";
  var ul=el("ul","list");
  rows.forEach(function(r){
   var li=el("li");li.appendChild(el("span",null,r.n));
   var b=el("button","ghost","Copier le lien");
   b.onclick=function(){copy(r.u,b)};li.appendChild(b);ul.appendChild(li)});
  out.appendChild(ul);
  var row=el("div","row");
  var all=el("button",null,"Copier tous les liens");
  all.onclick=function(){copy(rows.map(function(r){return r.n+" : "+r.u}).join("\n"),all)};
  row.appendChild(all);out.appendChild(row);
  out.appendChild(el("p","hint","Envoie à chacun uniquement son lien. Si tu régénères la liste, les anciens liens ne sont plus valables."));
 };
}
function copy(text,btn){
 var old=btn.textContent;
 function ok(){btn.textContent="Copié";setTimeout(function(){btn.textContent=old},1500)}
 function fb(){try{var t=el("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();ok()}catch(e){btn.textContent="Copie impossible"}}
 try{navigator.clipboard.writeText(text).then(ok,fb)}catch(e){fb()}
}

function person(p){
 head();
 var st=el("div","stage");app.appendChild(st);
 st.appendChild(el("h1",null,"Bonjour "+p[0]));
 st.appendChild(el("p",null,"Votre Secret Santa vous attend."));
 var w=el("div","gwrap");st.appendChild(w);
 var glow=el("div","glow");w.appendChild(glow);
 var g=el("button","gift");g.setAttribute("aria-label","Ouvrir le cadeau");
 g.innerHTML='<span class="box"><span class="rib-v"></span></span><span class="lid"><span class="lrib"></span></span><span class="bow"><i></i><i></i></span>';
 var rh=el("span","rib-h");g.querySelector(".box").appendChild(rh);
 w.appendChild(g);
 var cta=el("div","cta","Touchez le cadeau");st.appendChild(cta);
 var rv=el("div","reveal");rv.setAttribute("aria-live","polite");st.appendChild(rv);
 var done=false;
 var rays=el("div","rays");w.insertBefore(rays,w.firstChild);
 g.onclick=function(){
  if(done)return;done=true;
  var final=p[1];
  cta.classList.add("off");
  try{navigator.vibrate&&navigator.vibrate([30,40,30,40,70])}catch(e){}
  function show(){
   rv.classList.add("card");
   rv.appendChild(el("div","lead","Vous offrez un cadeau à"));
   var nm=el("div","name");rv.appendChild(nm);
   var chs=Array.from(final),sp=[],lock=[],chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
   chs.forEach(function(){var s=el("span",null," ");nm.appendChild(s);sp.push(s);lock.push(false)});
   function finish(){nm.textContent=final;nm.classList.add("done");st.appendChild(el("p","hint","Gardez le secret jusqu’au jour J."));if(!reduce){burst(.2,.4,70);burst(.8,.4,70);burst(.5,.25,100)}}
   if(reduce){finish();return}
   var t0=performance.now(),dur=2400;
   (function tick(now){
    var f=Math.min(1,(now-t0)/dur),n=Math.floor(f*chs.length+(f>=1?1:0));
    chs.forEach(function(ch,i){
     if(i<n){if(!lock[i]){lock[i]=true;sp[i].textContent=ch;sp[i].className="lock"}}
     else sp[i].textContent=(ch===" "||ch==="-"||ch==="’")?ch:chars[Math.floor(Math.random()*26)];
    });
    if(f<1)requestAnimationFrame(tick);else setTimeout(finish,450);
   })(t0);
  }
  if(reduce){g.classList.add("open");show();return}
  g.classList.add("shake");
  setTimeout(function(){
   g.classList.remove("shake");g.classList.add("open");glow.classList.add("go");rays.classList.add("go");
   burst(.5,.3,120,true);
  },850);
  setTimeout(show,1650);
 };
}

var ps=[],run=false,cv=document.getElementById("fx"),cc=cv.getContext("2d");
var cols=["#f3dca0","#c9a45c","#fff6d8","#e2c47a"];
function star(x,y,r){cc.beginPath();cc.moveTo(x,y-r);cc.quadraticCurveTo(x,y,x+r,y);cc.quadraticCurveTo(x,y,x,y+r);cc.quadraticCurveTo(x,y,x-r,y);cc.quadraticCurveTo(x,y,x,y-r);cc.fill()}
function burst(fx,fy,n,anchor){
 var dpr=Math.min(2,window.devicePixelRatio||1),ox,oy;
 if(!run){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cc.setTransform(dpr,0,0,dpr,0,0)}
 if(anchor){var o=document.querySelector(".gwrap").getBoundingClientRect();ox=o.left+o.width/2;oy=o.top+o.height*.4}
 else{ox=innerWidth*fx;oy=innerHeight*fy}
 for(var i=0;i<n;i++){var a=Math.random()*6.283,s=2+Math.random()*8;
  ps.push({x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:1+Math.random()*2.4,s:Math.random()<.4,c:cols[i%4],l:1,d:.006+Math.random()*.01})}
 if(run)return;run=true;
 (function frame(){
  cc.clearRect(0,0,innerWidth,innerHeight);
  ps=ps.filter(function(p){return p.l>0});
  ps.forEach(function(p){
   p.vy+=.11;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
   cc.globalAlpha=Math.max(0,p.l)*(.65+.35*Math.sin(p.l*70));cc.fillStyle=p.c;cc.shadowColor=p.c;cc.shadowBlur=8;
   if(p.s)star(p.x,p.y,p.r*3.2);else{cc.beginPath();cc.arc(p.x,p.y,p.r,0,6.283);cc.fill()}
  });
  if(ps.length)requestAnimationFrame(frame);else{run=false;cc.clearRect(0,0,innerWidth,innerHeight)}
 })();
}

function route(){var p=dec(location.hash.slice(1));if(p)person(p);else admin()}
window.addEventListener("hashchange",route);
route();
})();
</script>
